/* Layout: полноэкранное приложение. Главная — полка с обложками тетрадей; тетрадь — холст на весь экран, сверху тонкая панель, снизу плавающая панель инструментов. */
:root {
  --paper: #fbfcfe;
  --grid: #cfdcf0;
  --grid-major: #b3c5e2;
  --bg: #eceff5;
  --surface: #ffffff;

  --line: #d8dfeb;

  --accent-soft: #e0e8fc;
  --danger: #c8352c;
  --shadow: 0 1px 2px rgba(20, 30, 60, .08), 0 10px 28px rgba(20, 30, 60, .12);
  --font-ui: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-hand: 'Marck Script', 'Segoe Script', 'Bradley Hand', cursive;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a26; --grid: #232d44; --grid-major: #2f3d5c;
    --bg: #0e1320; --surface: #1b2232; --surface-2: #242c3f;
    --fg: #e8ecf5; --muted: #99a4bb; --line: #2d374d;
    --accent: #86a2ff; --accent-ink: #0e1320; --accent-soft: #26325a;
    --danger: #ff7b70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a26; --grid: #232d44; --grid-major: #2f3d5c;
  --bg: #0e1320; --surface: #1b2232; --surface-2: #242c3f;
  --fg: #e8ecf5; --muted: #99a4bb; --line: #2d374d;
  --accent: #86a2ff; --accent-ink: #0e1320; --accent-soft: #26325a;
  --danger: #ff7b70;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);

}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

  overscroll-behavior: none;

}
button { font: inherit; color: inherit; cursor: pointer; }

#app { height: 100%; position: relative; }

/* ——— кнопки ——— */
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 500;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: none; padding: 0 10px 0 4px; }
.btn.ghost:hover { background: var(--surface-2); }
.ib {
  width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; background: none;
}
.ib:hover:not(:disabled) { background: var(--surface-2); }

/* ——— главная ——— */
#home { height: 100%; overflow-y: auto; padding-block: 36px 56px; padding-left: var(--gl); padding-right: var(--gr); }

.nb { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.cover {

.cover:hover { transform: translateY(-3px); }

  background-size: 18px 18px;
}
.label { position: absolute; z-index: 1; left: 32px; right: 16px; top: 20%; padding: 10px 12px 14px; border-radius: 3px; background: #fdfdfb; color: #1b2233; box-shadow: 0 1px 0 rgba(0,0,0,.2); }

.label-name { display: block; font: 400 27px/1.08 var(--font-hand); overflow-wrap: anywhere; }
.nb .meta { font-size: 13px; color: var(--muted); padding-left: 2px; }
.more {
  position: absolute; top: 8px; right: 8px; z-index: 2; width: 36px; height: 36px; display: grid; place-items: center;

}
.more:hover { background: #fff; }
.nb-new {
  width: 100%; aspect-ratio: 3 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  border: 2px dashed var(--line); border-radius: 4px 12px 12px 4px; background: none; color: var(--muted); font-weight: 500;

.nb-new svg { width: 30px; height: 30px; }
.nb-new:hover { color: var(--accent); border-color: var(--accent); }

#book { height: 100%; position: relative; display: flex; flex-direction: column; background: var(--paper); }
.bar {

  background: var(--surface); border-bottom: 1px solid var(--line); z-index: 3;
}
.bar h2 { margin: 0; flex: 1; min-width: 0; font: 400 26px/1 var(--font-hand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
.zoom { min-width: 56px; height: 40px; border: 0; border-radius: 10px; background: none; font-weight: 500; font-variant-numeric: tabular-nums; }
.zoom:hover { background: var(--surface-2); }
.chip {
  height: 34px; padding: 0 12px; margin-right: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

#stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: crosshair; }
#stage.t-hand { cursor: grab; }
#stage.t-sticker { cursor: cell; }
#stage.panning { cursor: grabbing; }
#stage canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
#eraserCursor { position: absolute; border: 1.5px solid var(--fg); border-radius: 50%; pointer-events: none; opacity: .55; transform: translate(-50%, -50%); }

.sticker {
  position: absolute; left: 0; top: 0; display: flex; flex-direction: column; border-radius: 3px; color: #1d2433; touch-action: none;
  box-shadow: 0 1px 1px rgba(0,0,0,.14), 0 8px 16px rgba(20,30,60,.2); pointer-events: none;
}
#stage.t-hand .sticker { pointer-events: auto; }
.st-bar { display: none; height: 24px; flex: none; align-items: center; justify-content: space-between; padding: 0 3px; background: rgba(0,0,0,.08); cursor: grab; touch-action: none; }
#stage.t-hand .st-bar { display: flex; }
.st-bar button { width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: none; color: #1d2433; font-size: 16px; line-height: 1; }
.st-bar button:hover { background: rgba(0,0,0,.12); }
.st-bar .st-col i { display: block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.55); }
.sticker textarea {

  font: 500 15px/1.35 var(--font-ui); -webkit-user-select: text; user-select: text;
}
.st-resize {
  display: none; position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.35) 50% 57%, transparent 57% 68%, rgba(0,0,0,.35) 68% 75%, transparent 75%);

#stage.t-hand .st-resize { display: block; }

#dock {
  position: absolute; left: 0; right: 0; bottom: 14px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 0 var(--gr) 0 var(--gl); pointer-events: none;
}
#dock > * { pointer-events: auto; max-width: 100%; }
.pill { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
#tools { display: flex; gap: 2px; padding: 6px; overflow-x: auto; scrollbar-width: none; }
#tools::-webkit-scrollbar { display: none; }
.tool {

  border: 0; border-radius: 12px; background: none; color: var(--muted); font-size: 11px; font-weight: 500;

.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.sw, .sz { width: 38px; height: 38px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: none; }

.sz[aria-pressed="true"] { background: var(--accent-soft); }
.sz[aria-pressed="true"] i { background: var(--accent); }
.tg { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 13px; font-weight: 500; color: var(--muted); }
.tg[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); padding: 6px 4px; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(8, 12, 24, .5); }
.card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.card h3 { margin: 0 0 4px; font: 400 32px/1 var(--font-hand); }

.card input { height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--fg); font: inherit; font-size: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }

    $('.st-col', el).addEventListener('click', function () {
      var it = getSticker(id); if (!it) return;
      var n = Object.assign({}, it, { c: STICKER_KEYS[(STICKER_KEYS.indexOf(it.c) + 1) % STICKER_KEYS.length] });
      commit(function (a) { return a.map(function (x) { return x === it ? n : x; }); });
    });
    var pushed = false;
    ta.addEventListener('focus', function () { pushed = false; });
    ta.addEventListener('input', function () {
      var it = getSticker(id); if (!it) return;
      if (!pushed) { pushUndo(); pushed = true; updateButtons(); }
      var n = Object.assign({}, it, { tx: ta.value });
      nb.items = nb.items.map(function (x) { return x === it ? n : x; });
      nb.updated = Date.now(); scheduleSave();
    });
    ta.addEventListener('keydown', function (e) { e.stopPropagation(); });
    return el;
  }
  function syncStickers() {
    var seen = new Set();
    nb.items.forEach(function (it, i) {
      if (it.t !== 'n') return;
      seen.add(it.id);
      var el = stEls.get(it.id);
      if (!el) { el = makeSticker(it.id); stEls.set(it.id, el); world.appendChild(el); }
      el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
      el.style.width = it.w + 'px'; el.style.height = it.h + 'px';
      el.style.background = STICKER[it.c] || STICKER.yellow;
      el.style.zIndex = i + 1;
      $('.st-col i', el).style.background = STICKER[it.c] || STICKER.yellow;
      var ta = $('textarea', el);
      if (document.activeElement !== ta && ta.value !== it.tx) ta.value = it.tx;
    });
    stEls.forEach(function (el, id) { if (!seen.has(id)) { el.remove(); stEls.delete(id); } });
  }
  function placeSticker(wx, wy) {
    var it = { t: 'n', id: uid(), x: snapH(wx - 78), y: snapH(wy - 40), w: 156, h: 130, c: prefs.sticker.c, tx: '' };
    commit(function (a) { return a.concat(it); });
    setTool('hand');
    setTimeout(function () { var el = stEls.get(it.id); if (el) $('textarea', el).focus(); }, 40);
  }

  /* ——— инструменты и панель параметров ——— */
  function setTool(t) {
    tool = t; prefs.tool = t; scheduleSave();
    stage.className = ''; stage.classList.add('t-' + t);
    var tb = $('#tools');
    Array.prototype.forEach.call(tb.children, function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-tool') === t); });
    if (t !== 'hand' && document.activeElement && document.activeElement.tagName === 'TEXTAREA') document.activeElement.blur();
    eraserEl.hidden = true;
    renderOpts();
  }
  function buildTools() {
    $('#tools').innerHTML = TOOLS.map(function (t) {
      return '<button class="tool" data-tool="' + t.id + '" aria-pressed="false" title="' + t.label + '">' + icon(t.icon) + '<span>' + t.label + '</span></button>';
    }).join('');
  }
  $('#tools').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tool]'); if (b) setTool(b.getAttribute('data-tool'));
  });

  function swatches(keys, cur, attr) {
    return '<div class="grp" role="group" aria-label="Цвет">' + keys.map(function (k) {
      var hex = attr === 'sc' ? STICKER[k] : col(k);
      return '<button class="sw" data-' + attr + '="' + k + '" aria-pressed="' + (k === cur) + '" aria-label="' + COLOR_NAMES[k] + '" title="' + COLOR_NAMES[k] + '" style="--c:' + hex + '"><i></i></button>';
    }).join('') + '</div>';
  }
  function sizes(t) {
    var cur = prefs[t].s;
    return '<div class="grp" role="group" aria-label="Толщина">' + DOTS.map(function (d, i) {
      return '<button class="sz" data-sz="' + i + '" aria-pressed="' + (i === cur) + '" aria-label="' + SIZE_NAMES[i] + '" title="' + SIZE_NAMES[i] + '"><i style="width:' + d + 'px;height:' + d + 'px"></i></button>';
    }).join('') + '</div>';
  }
  function renderOpts() {
    var o = $('#opts'), h = '';
    if (tool === 'pen' || tool === 'pencil' || tool === 'hl') {
      h = swatches(PALETTES[tool], prefs[tool].c, 'c') + sizes(tool) +
        '<div class="grp"><button class="tg" data-tg="hold" aria-pressed="' + prefs.hold + '">Ровно при удержании</button></div>';
    }
    else if (tool === 'eraser') h = sizes('eraser') + '<span class="hint">Стирает штрих целиком</span>';
    else if (tool === 'line' || tool === 'dash') {
      h = swatches(PALETTES[tool], prefs[tool].c, 'c') + sizes(tool) +
        '<div class="grp"><button class="tg" data-tg="snapGrid" aria-pressed="' + prefs.snapGrid + '">К узлам клеток</button>' +
        '<button class="tg" data-tg="snapAxis" aria-pressed="' + prefs.snapAxis + '">Ровные углы</button></div>';
    } else if (tool === 'sticker') h = swatches(STICKER_KEYS, prefs.sticker.c, 'sc') + '<span class="hint">Нажмите на лист, чтобы поставить стикер</span>';
    else h = '<span class="hint">Двигайте лист. За верхнюю полосу стикера его можно перетащить, за угол изменить размер.</span>';
    o.innerHTML = h;
  }
  $('#opts').addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-c]'))) prefs[tool].c = b.getAttribute('data-c');
    else if ((b = e.target.closest('[data-sc]'))) prefs.sticker.c = b.getAttribute('data-sc');
    else if ((b = e.target.closest('[data-sz]'))) prefs[tool].s = +b.getAttribute('data-sz');
    else if ((b = e.target.closest('[data-tg]'))) prefs[b.getAttribute('data-tg')] = !prefs[b.getAttribute('data-tg')];
    else return;
    scheduleSave(); renderOpts();
  });

  function updateFinger() {
    var b = $('#btnFinger');
    b.setAttribute('aria-pressed', prefs.finger);
    b.textContent = prefs.finger ? 'Палец: рисует' : 'Палец: листает';
  }
  $('#btnFinger').addEventListener('click', function () { prefs.finger = !prefs.finger; updateFinger(); scheduleSave(); });

  /* ——— масштаб ——— */
  function viewChanged() { requestRender(); scheduleSave(); }
  function zoomAt(px, py, ns) {
    ns = clamp(ns, MIN_S, MAX_S);
    var k = ns / view.s;
    view.x = px - (px - view.x) * k; view.y = py - (py - view.y) * k; view.s = ns;
    viewChanged();
  }
  $('#btnZoomIn').addEventListener('click', function () { zoomAt(W / 2, H / 2, view.s * 1.25); });
  $('#btnZoomOut').addEventListener('click', function () { zoomAt(W / 2, H / 2, view.s / 1.25); });
  $('#zoomPct').addEventListener('click', function () { zoomAt(W / 2, H / 2, 1); });
  $('#btnFit').addEventListener('click', function () {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    nb.items.forEach(function (it) { var b = bbox(it); x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); });
    if (x0 === Infinity) { view.x = 0; view.y = 0; view.s = 1; viewChanged(); return; }
    var s = clamp(Math.min(W / (x1 - x0 + 120), H / (y1 - y0 + 220), 2), MIN_S, MAX_S);
    view.s = s; view.x = W / 2 - (x0 + x1) / 2 * s; view.y = (H - 90) / 2 - (y0 + y1) / 2 * s;
    viewChanged();
  });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, view.s * Math.exp(-e.deltaY * 0.0125));
    else { view.x -= e.deltaX; view.y -= e.deltaY; viewChanged(); }
  }, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(function (n) { stage.addEventListener(n, function (e) { e.preventDefault(); }); });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ——— ввод: палец, стилус, мышь ——— */
  function localPt(e) { var r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  function cancelGesture() { clearTimeout(holdTimer); cur = null; gesture = null; eraserEl.hidden = true; stage.classList.remove('panning'); requestRender(); }

  function onDown(e) {
    if (!nb) return;
    if (e.target.closest && e.target.closest('.sticker')) return;
    if (e.pointerType === 'mouse' && e.button === 2) return;
    if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') document.activeElement.blur();
    if (e.pointerType === 'touch' && penActive) return;
    if (e.pointerType === 'pen') { penActive = true; clearTimeout(penTimer); if (gesture) cancelGesture(); }
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    var pt = localPt(e); pt.type = e.pointerType; pt.id = e.pointerId;
    pointers.set(e.pointerId, pt);
    var touches = [];
    pointers.forEach(function (p) { if (p.type === 'touch') touches.push(p); });
    if (e.pointerType === 'touch' && touches.length >= 2 && !(gesture && gesture.type === 'pinch')) {
      if (gesture && gesture.type !== 'lock') cancelGesture();
      startPinch(touches[0], touches[1]); return;
    }
    if (gesture) return;
    startSingle(e, pt);
  }

  function startPinch(a, b) {
    cur = null;
    gesture = { type: 'pinch', a: a.id, b: b.id, d0: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, v: { x: view.x, y: view.y, s: view.s } };
    requestRender();
  }

  function startSingle(e, pt) {
    var w = toWorld(pt.x, pt.y);
    var pan = tool === 'hand' || (e.pointerType === 'mouse' && (e.button === 1 || spaceDown)) || (e.pointerType === 'touch' && !prefs.finger);
    if (pan) { gesture = { type: 'pan', id: e.pointerId, lx: pt.x, ly: pt.y }; stage.classList.add('panning'); return; }
    if (tool === 'pen' || tool === 'pencil' || tool === 'hl') {
      var cfg = prefs[tool], isPen = e.pointerType === 'pen';
      var pr = isPen ? (e.pressure || 0.5) : 0.5;
      cur = { t: 's', k: tool, c: cfg.c, w: SIZES[tool][cfg.s], v: isPen ? 1 : 0, p: [round1(w.x), round1(w.y), isPen ? Math.round(pr * 100) / 100 : 0.5] };
      gesture = { type: 'draw', id: e.pointerId, lx: pt.x, ly: pt.y, pr: pr, hx: pt.x, hy: pt.y };
      armHold();
      requestRender();
    } else if (tool === 'eraser') {
      gesture = { type: 'erase', id: e.pointerId, lx: pt.x, ly: pt.y, pushed: false };
      eraseTo(pt.x, pt.y); showEraser(pt.x, pt.y);
    } else if (tool === 'line' || tool === 'dash') {
      var c2 = prefs[tool], x = w.x, y = w.y;
      if (prefs.snapGrid) { x = snapG(x); y = snapG(y); }
      cur = { t: 'l', c: c2.c, w: SIZES[tool][c2.s], d: tool === 'dash' ? 1 : 0, x1: x, y1: y, x2: x, y2: y };
      gesture = { type: 'line', id: e.pointerId };
      requestRender();
    } else if (tool === 'sticker') {
      gesture = { type: 'tap', id: e.pointerId, sx: pt.x, sy: pt.y, wx: w.x, wy: w.y };
    }
  }

  function updateLine(wx, wy, free) {
    var x = wx, y = wy, x0 = cur.x1, y0 = cur.y1;
    if (prefs.snapAxis) {
      var ang = Math.atan2(Math.abs(y - y0), Math.abs(x - x0));
      if (ang < 0.09) y = y0; else if (ang > Math.PI / 2 - 0.09) x = x0;
    }
    if (!free && prefs.snapGrid) { x = snapG(x); y = snapG(y); }
    cur.x2 = x; cur.y2 = y;
  }

  /* Выпрямление при удержании: ровная линия или круг/эллипс */
  var holdTimer = 0;
  function armHold() {
    clearTimeout(holdTimer);
    if (prefs.hold) holdTimer = setTimeout(recognize, 550);
  }
  function recognize() {
    var g = gesture;
    if (!g || g.type !== 'draw' || !cur || g.locked) return;
    var p = cur.p, n = p.length / 3, i, len = 0, s = view.s;
    if (n < 6) return;
    var x0 = p[0], y0 = p[1], xe = p[(n - 1) * 3], ye = p[(n - 1) * 3 + 1];
    var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (i = 0; i < n; i++) {
      var x = p[i * 3], y = p[i * 3 + 1];
      if (i) len += Math.hypot(x - p[i * 3 - 3], y - p[i * 3 - 2]);
      minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y);
    }
    if (len * s < 30) return;
    var chord = Math.hypot(xe - x0, ye - y0);
    if (chord < len * 0.3) {
      var cx = (minx + maxx) / 2, cy = (miny + maxy) / 2, rx = (maxx - minx) / 2, ry = (maxy - miny) / 2;
      if (rx * s < 8 || ry * s < 8) return;
      var sum = 0;
      for (i = 0; i < n; i++) {
        var d = Math.sqrt(Math.pow((p[i * 3] - cx) / rx, 2) + Math.pow((p[i * 3 + 1] - cy) / ry, 2)) - 1;
        sum += d * d;
      }
      if (Math.sqrt(sum / n) > 0.2) return;
      if (Math.abs(rx - ry) / Math.max(rx, ry) < 0.18) { rx = ry = (rx + ry) / 2; }
      var pts = [], k, a;
      for (k = 0; k <= 72; k++) { a = k / 72 * Math.PI * 2; pts.push(round1(cx + rx * Math.cos(a)), round1(cy + ry * Math.sin(a)), 0.5); }
      cur.p = pts; cur.v = 0; g.locked = true;
    } else {
      if (chord * s < 20) return;
      var dev = 0;
      for (i = 0; i < n; i++) {
        dev = Math.max(dev, Math.abs((xe - x0) * (y0 - p[i * 3 + 1]) - (x0 - p[i * 3]) * (ye - y0)) / chord);
      }
      if (dev / chord > 0.3) return;
      cur = { t: 'l', k: cur.k, c: cur.c, w: cur.w, d: 0, x1: x0, y1: y0, x2: xe, y2: ye };
      gesture = { type: 'line', id: g.id, free: true };
      var pt = pointers.get(g.id);
      if (pt) { var w = toWorld(pt.x, pt.y); updateLine(w.x, w.y, true); }
    }
    requestRender();
  }

  function showEraser(x, y) {
    var d = SIZES.eraser[prefs.eraser.s] * 2;
    eraserEl.hidden = false;
    eraserEl.style.width = d + 'px'; eraserEl.style.height = d + 'px';
    eraserEl.style.left = x + 'px'; eraserEl.style.top = y + 'px';
  }
  function eraseTo(sx, sy) {
    var g = gesture, rs = SIZES.eraser[prefs.eraser.s], r = rs / view.s;
    var d = Math.hypot(sx - g.lx, sy - g.ly), n = Math.max(1, Math.ceil(d / Math.max(4, rs * 0.5)));
    var items = nb.items, changed = false, i, w, keep;
    for (i = 1; i <= n; i++) {
      w = toWorld(g.lx + (sx - g.lx) * i / n, g.ly + (sy - g.ly) * i / n);
      keep = items.filter(function (it) { return !hits(it, w.x, w.y, r); });
      if (keep.length !== items.length) {
        if (!g.pushed) { pushUndo(); g.pushed = true; }
        items = keep; changed = true;
      }
    }
    g.lx = sx; g.ly = sy;
    if (changed) { nb.items = items; afterItems(); }
  }

  function onMove(e) {
    if (!nb) return;
    var pt = pointers.get(e.pointerId), r = stage.getBoundingClientRect();
    if (!pt) {
      if (e.pointerType === 'mouse' && tool === 'eraser') showEraser(e.clientX - r.left, e.clientY - r.top);
      return;
    }
    pt.x = e.clientX - r.left; pt.y = e.clientY - r.top;
    var g = gesture; if (!g) return;
    if (g.type === 'pinch') {
      var a = pointers.get(g.a), b = pointers.get(g.b);
      if (!a || !b) return;
      var d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      var ns = clamp(g.v.s * d / g.d0, MIN_S, MAX_S);
      var wx = (g.cx - g.v.x) / g.v.s, wy = (g.cy - g.v.y) / g.v.s;
      view.s = ns; view.x = cx - wx * ns; view.y = cy - wy * ns;
      viewChanged(); return;
    }
    if (g.id !== e.pointerId) return;
    var i, list, ce, x, y, w;
    switch (g.type) {
      case 'pan':
        view.x += pt.x - g.lx; view.y += pt.y - g.ly; g.lx = pt.x; g.ly = pt.y; viewChanged(); break;
      case 'draw':
        if (g.locked) break;
        list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
        if (!list.length) list = [e];
        for (i = 0; i < list.length; i++) {
          ce = list[i]; x = ce.clientX - r.left; y = ce.clientY - r.top;
          if (Math.hypot(x - g.lx, y - g.ly) < (e.pointerType === 'pen' ? 0.8 : 1.4)) continue;
          g.lx = x; g.ly = y;
          if (cur.v) g.pr = g.pr * 0.6 + (ce.pressure || 0.5) * 0.4;
          w = toWorld(x, y);
          cur.p.push(round1(w.x), round1(w.y), cur.v ? Math.round(g.pr * 100) / 100 : 0.5);
        }
        if (Math.hypot(pt.x - g.hx, pt.y - g.hy) > 5) { g.hx = pt.x; g.hy = pt.y; armHold(); }
        requestRender(); break;
      case 'line':
        w = toWorld(pt.x, pt.y); updateLine(w.x, w.y, g.free); requestRender(); break;
      case 'erase':
        eraseTo(pt.x, pt.y); showEraser(pt.x, pt.y); break;
      case 'tap':
        if (Math.hypot(pt.x - g.sx, pt.y - g.sy) > 8) { gesture = { type: 'pan', id: g.id, lx: pt.x, ly: pt.y }; stage.classList.add('panning'); }
        break;
    }
  }

  function onUp(e) {
    if (!nb) return;
    clearTimeout(holdTimer);
    var pt = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    if (e.pointerType === 'pen') { clearTimeout(penTimer); penTimer = setTimeout(function () { penActive = false; }, 800); }
    var g = gesture;
    if (g) {
      if (g.type === 'pinch') {
        if (e.pointerId === g.a || e.pointerId === g.b) gesture = pointers.size ? { type: 'lock' } : null;
      } else if (g.type === 'lock') {
        if (!pointers.size) gesture = null;
      } else if (g.id === e.pointerId) {
        finish(g, e.type === 'pointercancel', pt);
        gesture = null;
      }
    }
    if (!pointers.size) gesture = null;
    stage.classList.remove('panning');
    if (e.pointerType !== 'mouse') eraserEl.hidden = true;
  }

  function finish(g, canceled, pt) {
    var c;
    if (g.type === 'draw') {
      c = cur; cur = null;
      if (c && !canceled) commit(function (a) { return a.concat(c); }); else requestRender();
    } else if (g.type === 'line') {
      c = cur; cur = null;
      if (c && !canceled && Math.hypot(c.x2 - c.x1, c.y2 - c.y1) * view.s > 4) commit(function (a) { return a.concat(c); }); else requestRender();
    } else if (g.type === 'tap') {
      if (!canceled) placeSticker(g.wx, g.wy);
    }
  }

  stage.addEventListener('pointerdown', onDown);
  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerup', onUp);
  stage.addEventListener('pointercancel', onUp);
  stage.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !pointers.size) eraserEl.hidden = true; });

  /* ——— клавиатура ——— */
  function typing() { var a = document.activeElement; return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT'); }
  window.addEventListener('keydown', function (e) {
    if (!nb || typing()) return;
    if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  });
  window.addEventListener('keyup', function (e) { if (e.code === 'Space') spaceDown = false; });

  /* ——— запуск ——— */
  document.querySelectorAll('[data-icon]').forEach(function (el) { el.insertAdjacentHTML('afterbegin', icon(el.getAttribute('data-icon'))); });
  buildTools();
  readTheme();
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', onTheme);
  }
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function start(raw) {
    var parsed = null;
    if (raw) { try { parsed = JSON.parse(raw); } catch (e) { parsed = null; } }
    data = parsed && Array.isArray(parsed.nbs) ? parsed : seed();
    if (data.prefs) prefs = Object.assign(JSON.parse(JSON.stringify(DEFAULT_PREFS)), data.prefs);
    data.prefs = prefs;
    renderHome();
    if (!parsed) scheduleSave();
  }
  var started = false;
  function startOnce(raw) { if (started) return; started = true; start(raw); }
  loadRaw().then(startOnce, function () { startOnce(null); });
  setTimeout(function () { startOnce(null); }, 1500);
})();
</script>

</body></html>
